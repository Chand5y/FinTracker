      - name: Generate Native Branded Launch Screen from logo.png
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          icon_candidates = [
              "logo.png",
              "assets/logo.png",
              "assets/icon/logo.png",
              "assets/icon/icon.png",
              "android/app/src/main/res/mipmap-xxxhdpi/launcher_icon.png",
          ]
          icon_path = next((p for p in icon_candidates if os.path.exists(p)), None)
          print(f"Using splash logo from: {icon_path}")

          os.makedirs("android/app/src/main/res/drawable-nodpi", exist_ok=True)
          os.makedirs("android/app/src/main/res/drawable-night-nodpi", exist_ok=True)

          def make_splash_center(is_dark, out_path):
              W, H = 720, 720
              canvas = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              draw = ImageDraw.Draw(canvas)

              icon_size = 240
              if icon_path:
                  ic = Image.open(icon_path).convert("RGBA").resize((icon_size, icon_size), Image.LANCZOS)
                  mask = Image.new("L", (icon_size, icon_size), 0)
                  mdraw = ImageDraw.Draw(mask)
                  mdraw.rounded_rectangle((0, 0, icon_size, icon_size), radius=56, fill=255)
                  canvas.paste(ic, ((W - icon_size) // 2, 165), mask)

              bold_paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              ]
              reg_paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf",
              ]
              bold_font_path = next((p for p in bold_paths if os.path.exists(p)), None)
              reg_font_path = next((p for p in reg_paths if os.path.exists(p)), None)

              font_bold = ImageFont.truetype(bold_font_path, 72) if bold_font_path else ImageFont.load_default()
              font_reg = ImageFont.truetype(reg_font_path, 72) if reg_font_path else ImageFont.load_default()

              fin_text = "Fin"
              trax_text = "Trax"
              fin_bbox = draw.textbbox((0, 0), fin_text, font=font_bold)
              trax_bbox = draw.textbbox((0, 0), trax_text, font=font_reg)
              fin_w = fin_bbox[2] - fin_bbox[0]
              trax_w = trax_bbox[2] - trax_bbox[0]
              total_w = fin_w + trax_w + 4

              start_x = (W - total_w) // 2
              text_y = 445

              fin_color = (255, 255, 255, 255) if is_dark else (14, 23, 38, 255)
              trax_color = (197, 160, 89, 255) if is_dark else (154, 119, 50, 255)

              draw.text((start_x, text_y), fin_text, font=font_bold, fill=fin_color)
              draw.text((start_x + fin_w + 4, text_y), trax_text, font=font_reg, fill=trax_color)
              canvas.save(out_path, "PNG")

          make_splash_center(False, "android/app/src/main/res/drawable-nodpi/splash_brand.png")
          make_splash_center(True, "android/app/src/main/res/drawable-night-nodpi/splash_brand.png")
          EOF

