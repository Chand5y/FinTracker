name: Build FinTrax APK
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04 
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Permanent Signing Key
        run: |
          if [ ! -f "fintrax.jks" ]; then
            echo "Generating permanent FinTrax signing key..."
            keytool -genkeypair -v \
              -keystore fintrax.jks \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Chandan Kumar, OU=FinTrax, O=Chandsy, L=Patna, ST=Bihar, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add fintrax.jks
            git commit -m "Lock permanent Android signing key" || true
            git push || true
          fi
          mkdir -p ~/.android
          cp fintrax.jks ~/.android/debug.keystore
          
      - name: Generate Android configuration files
        run: flutter create --project-name fintrax --org com.chandsy .

      - name: Ensure logo.png and assets/Icons/ are registered in pubspec.yaml
        run: |
          python3 - << 'EOF'
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          if "assets:" not in content and "uses-material-design: true" in content:
              content = content.replace(
                  "uses-material-design: true",
                  "uses-material-design: true\n  assets:\n    - logo.png\n    - assets/Icons/",
                  1,
              )
          else:
              if "- logo.png" not in content:
                  content = content.replace("assets:", "assets:\n    - logo.png", 1)
              if "assets/Icons/" not in content:
                  content = content.replace("assets:", "assets:\n    - assets/Icons/", 1)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          EOF

      - name: Configure Native Bridge & Disable R8 Stripping
        run: |
          INSTALLED_NDK=$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -n 1)
          echo "Using pre-installed NDK: $INSTALLED_NDK"
          sed -i "s/flutter.ndkVersion/\"$INSTALLED_NDK\"/g" android/app/build.gradle*
          sed -i 's/android:label="fintrax"/android:label="FinTrax"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_SMS"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <application android:allowBackup="false" android:fullBackupOnly="false"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <receiver android:name=".ReminderReceiver" android:exported="false"\/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/buildTypes {/buildTypes {\n        getByName("release") {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }/g' android/app/build.gradle.kts || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/buildTypes {/buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n        }/g' android/app/build.gradle || true
          fi
          echo "android.enableR8.fullMode=false" >> android/gradle.properties

          cat << 'EOF' > android/app/proguard-rules.pro
          -dontshrink
          -dontoptimize
          -dontobfuscate
          -keep class kotlin.** { *; }
          -keep class kotlinx.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn kotlin.**
          -dontwarn io.flutter.**
          EOF

          mkdir -p android/app/src/main/kotlin/com/chandsy/fintrax

          cat << 'EOF' > android/app/src/main/kotlin/com/chandsy/fintrax/ReminderReceiver.kt
          package com.chandsy.fintrax

          import android.Manifest
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import java.util.Calendar

          class ReminderReceiver : BroadcastReceiver() {

              private val dailyMessages = arrayOf(
                  "Your wallet had an eventful day. Take 30 seconds to log where the money went!",
                  "Quick check-in: Did you spend money today, or did money just mysteriously evaporate?",
                  "UPI makes spending take 2 seconds. Logging it in FinTrax only takes 5!",
                  "That 'small' coffee and snack add up faster than you think. Log today's expenses!",
                  "Before you scroll yourself to sleep, give your expense book 30 seconds of love.",
                  "Future You called. They want to know what you spent ₹250 on today.",
                  "Your bank balance knows what you did today. Might as well tell FinTrax too!",
                  "Even ₹20 chai counts when it's a daily ritual. Log your day's entries!",
                  "Don't let today's expenses become next month's 'Wait, where did my salary go?' mystery.",
                  "Memory fades by tomorrow morning, but numbers in FinTrax stay forever. Log today's spend!",
                  "Zero judgement if you ordered food again today—just log it so you stay in control!",
                  "Did your money go to groceries, shopping, or 'miscellaneous vibes' today? Jot it down!",
                  "A 10-second log tonight saves a 2-hour head-scratching session at the end of the month.",
                  "If you scanned a QR code today, this notification is officially looking at you.",
                  "Your money works hard for you. The least we can do is keep track of where it travels!",
                  "Spent nothing today? Amazing, enjoy the victory! Spent a little? Let's log it.",
                  "Treat your wallet like a business—close the register before you go to bed.",
                  "Mystery expenses are only fun in movies. Log today's transactions while they're fresh!",
                  "One quick tap in FinTrax tonight = total peace of mind on the 1st of next month.",
                  "Did someone borrow money from you today? Log it in your Lending book before you both forget!"
              )

              private val monthNames = arrayOf(
                  "January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"
              )

              override fun onReceive(context: Context, intent: Intent?) {
                  val kind = intent?.getStringExtra("kind") ?: "daily"
                  val channelId = "fintrax_daily_reminder"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FinTrax Reminders & Insights", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(channel)
                  }

                  if (kind == "monthly_insight") {
                      val cal = Calendar.getInstance()
                      cal.add(Calendar.MONTH, -1)
                      val prevMonthName = monthNames[cal.get(Calendar.MONTH)]
                      val title = "FinTrax • Your $prevMonthName Expense Summary is Ready 📊"
                      val bodyText = "See how much you spent on shopping, groceries, and your net savings in $prevMonthName. Tap to view your insights!"

                      val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)?.apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("open_monthly_insights", true)
                      }
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val contentPi = PendingIntent.getActivity(context, 2002, launchIntent, piFlags)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(context, channelId)
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(context)
                      }

                      builder.setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(bodyText)
                          .setStyle(android.app.Notification.BigTextStyle().bigText(bodyText))
                          .setAutoCancel(true)
                          .setContentIntent(contentPi)

                      nm.notify(3002, builder.build())
                      scheduleMonthlyInsight(context)
                      return
                  }

                  val todaySmsCount = countTodayBankSms(context)
                  val cal = Calendar.getInstance()
                  val msgIndex = (cal.get(Calendar.DAY_OF_YEAR) + cal.get(Calendar.YEAR)) % dailyMessages.size
                  val wittyLine = dailyMessages[msgIndex]

                  val title = if (todaySmsCount > 0) {
                      "FinTrax • $todaySmsCount Bank Transaction${if (todaySmsCount > 1) "s" else ""} Found"
                  } else {
                      "FinTrax • Daily Expense Check-In"
                  }
                  val bodyText = if (todaySmsCount > 0) {
                      "$wittyLine (We also spotted $todaySmsCount bank SMS today—tap to review & add!)"
                  } else {
                      wittyLine
                  }

                  val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }
                  val contentPi = PendingIntent.getActivity(context, 2001, launchIntent, piFlags)

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      android.app.Notification.Builder(context, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      android.app.Notification.Builder(context)
                  }

                  builder.setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(bodyText)
                      .setStyle(android.app.Notification.BigTextStyle().bigText(bodyText))
                      .setAutoCancel(true)
                      .setContentIntent(contentPi)

                  nm.notify(3001, builder.build())

                  val hour = intent?.getIntExtra("hour", 21) ?: 21
                  val minute = intent?.getIntExtra("minute", 0) ?: 0
                  scheduleNext(context, hour, minute)
              }

              private fun countTodayBankSms(context: Context): Int {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      context.checkSelfPermission(Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) {
                      return 0
                  }
                  var count = 0
                  try {
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, 0)
                          set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                      }
                      val startOfDay = cal.timeInMillis
                      val cursor = context.contentResolver.query(
                          Uri.parse("content://sms/inbox"),
                          arrayOf("body", "date"),
                          "date >= ?",
                          arrayOf(startOfDay.toString()),
                          "date DESC"
                      )
                      val bankRegex = Regex("(a/c|acct|account|bank|upi|vpa|card|debited|credited|spent|paid)", RegexOption.IGNORE_CASE)
                      val txRegex = Regex("(debited|spent|paid|sent\\s+rs|withdrawn|credited|received)", RegexOption.IGNORE_CASE)
                      val amtRegex = Regex("(?:rs\\.?|inr|₹)\\s*[0-9,]+", RegexOption.IGNORE_CASE)
                      cursor?.use {
                          val bodyIdx = it.getColumnIndex("body")
                          while (it.moveToNext()) {
                              val body = if (bodyIdx >= 0) it.getString(bodyIdx) ?: "" else ""
                              val lower = body.lowercase()
                              if (!lower.contains("otp") && !lower.contains("verification code") &&
                                  bankRegex.containsMatchIn(body) && txRegex.containsMatchIn(body) && amtRegex.containsMatchIn(body)) {
                                  count++
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return count
              }

              companion object {
                  fun scheduleNext(context: Context, hour: Int, minute: Int) {
                      try {
                          val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          val intent = Intent(context, ReminderReceiver::class.java).apply {
                              putExtra("kind", "daily")
                              putExtra("hour", hour)
                              putExtra("minute", minute)
                          }
                          val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          } else {
                              PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val pi = PendingIntent.getBroadcast(context, 4001, intent, flags)
                          val cal = Calendar.getInstance().apply {
                              set(Calendar.HOUR_OF_DAY, hour)
                              set(Calendar.MINUTE, minute)
                              set(Calendar.SECOND, 0)
                              set(Calendar.MILLISECOND, 0)
                              if (timeInMillis <= System.currentTimeMillis()) {
                                  add(Calendar.DAY_OF_YEAR, 1)
                              }
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          } else {
                              am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          }
                          scheduleMonthlyInsight(context)
                      } catch (_: Exception) {}
                  }

                  fun scheduleMonthlyInsight(context: Context) {
                      try {
                          val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          val intent = Intent(context, ReminderReceiver::class.java).apply {
                              putExtra("kind", "monthly_insight")
                          }
                          val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          } else {
                              PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val pi = PendingIntent.getBroadcast(context, 4002, intent, flags)
                          val cal = Calendar.getInstance().apply {
                              set(Calendar.DAY_OF_MONTH, 1)
                              set(Calendar.HOUR_OF_DAY, 9)
                              set(Calendar.MINUTE, 0)
                              set(Calendar.SECOND, 0)
                              set(Calendar.MILLISECOND, 0)
                              if (timeInMillis <= System.currentTimeMillis()) {
                                  add(Calendar.MONTH, 1)
                                  set(Calendar.DAY_OF_MONTH, 1)
                              }
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          } else {
                              am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          }
                      } catch (_: Exception) {}
                  }

                  fun cancel(context: Context) {
                      try {
                          val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          val intent = Intent(context, ReminderReceiver::class.java)
                          val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          } else {
                              PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val pi = PendingIntent.getBroadcast(context, 4001, intent, flags)
                          am.cancel(pi)
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/chandsy/fintrax/MainActivity.kt
          package com.chandsy.fintrax

          import android.Manifest
          import android.app.Activity
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import java.security.MessageDigest
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.chandankumar.fintrack/sms"
              private var pendingSmsResult: MethodChannel.Result? = null
              private var pendingAuthResult: MethodChannel.Result? = null
              private var pendingPdfResult: MethodChannel.Result? = null
              private var pendingPdfBytes: ByteArray? = null
              private var pendingInsightOpen: Boolean = false

              private fun getInstalledSha1(): String {
                  return try {
                      val bytes = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                          val sigs = info.signingInfo?.apkContentsSigners
                          sigs?.firstOrNull()?.toByteArray()
                      } else {
                          @Suppress("DEPRECATION")
                          val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                          @Suppress("DEPRECATION")
                          info.signatures?.firstOrNull()?.toByteArray()
                      }
                      if (bytes != null) {
                          val md = MessageDigest.getInstance("SHA-1")
                          val digest = md.digest(bytes)
                          digest.joinToString(":") { "%02X".format(it) }
                      } else {
                          "UNKNOWN"
                      }
                  } catch (e: Exception) {
                      "ERROR: ${e.message}"
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "readAppPrefs" -> {
                              val sp = getSharedPreferences("FinTraxNativePrefs", Context.MODE_PRIVATE)
                              val all = mutableMapOf<String, Any?>()
                              for ((k, v) in sp.all) {
                                  all[k] = v
                              }
                              result.success(all)
                          }
                          "writeAppPref" -> {
                              val key = call.argument<String>("key") ?: ""
                              val value = call.argument<Any>("value")
                              if (key.isNotEmpty()) {
                                  val editor = getSharedPreferences("FinTraxNativePrefs", Context.MODE_PRIVATE).edit()
                                  when (value) {
                                      is Boolean -> editor.putBoolean(key, value)
                                      is Int -> editor.putInt(key, value)
                                      is Long -> editor.putInt(key, value.toInt())
                                      is String -> editor.putString(key, value)
                                      null -> editor.remove(key)
                                  }
                                  editor.apply()
                              }
                              result.success(true)
                          }
                          "getApkSignatureInfo" -> {
                              result.success(mapOf(
                                  "packageName" to packageName,
                                  "sha1" to getInstalledSha1()
                              ))
                          }
                          "consumeMonthlyInsightIntent" -> {
                              val fromLaunch = intent?.getBooleanExtra("open_monthly_insights", false) == true
                              intent?.removeExtra("open_monthly_insights")
                              val flag = pendingInsightOpen || fromLaunch
                              pendingInsightOpen = false
                              result.success(flag)
                          }
                          "requestNotificationPermission" -> {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1007)
                                  }
                              }
                              result.success(true)
                          }
                          "requestSmsPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  if (checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED) {
                                      result.success(true)
                                  } else {
                                      pendingSmsResult = result
                                      requestPermissions(arrayOf(Manifest.permission.READ_SMS), 1001)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }
                          "checkSmsPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  result.success(checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED)
                              } else {
                                  result.success(true)
                              }
                          }
                          "getBankSms" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) {
                                  result.success(emptyList<Map<String, Any>>())
                                  return@setMethodCallHandler
                              }
                              val smsList = mutableListOf<Map<String, Any>>()
                              try {
                                  val cursor = contentResolver.query(
                                      Uri.parse("content://sms/inbox"),
                                      arrayOf("_id", "address", "body", "date"),
                                      null,
                                      null,
                                      "date DESC"
                                  )
                                  cursor?.use {
                                      val idIdx = it.getColumnIndex("_id")
                                      val addrIdx = it.getColumnIndex("address")
                                      val bodyIdx = it.getColumnIndex("body")
                                      val dateIdx = it.getColumnIndex("date")
                                      var count = 0
                                      while (it.moveToNext() && count < 120) {
                                          val id = if (idIdx >= 0) it.getString(idIdx) ?: "" else ""
                                          val addr = if (addrIdx >= 0) it.getString(addrIdx) ?: "" else ""
                                          val body = if (bodyIdx >= 0) it.getString(bodyIdx) ?: "" else ""
                                          val date = if (dateIdx >= 0) it.getLong(dateIdx) else 0L
                                          smsList.add(mapOf("id" to id, "address" to addr, "body" to body, "date" to date))
                                          count++
                                      }
                                  }
                                  result.success(smsList)
                              } catch (e: Exception) {
                                  result.success(emptyList<Map<String, Any>>())
                              }
                          }
                          "isDeviceSecure" -> {
                              val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              result.success(km.isKeyguardSecure)
                          }
                          "authenticateDevice" -> {
                              val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              if (km.isKeyguardSecure) {
                                  @Suppress("DEPRECATION")
                                  val intent = km.createConfirmDeviceCredentialIntent("Unlock FinTrax", "Use your fingerprint or phone screen lock")
                                  if (intent != null) {
                                      pendingAuthResult = result
                                      startActivityForResult(intent, 1002)
                                  } else {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          "savePdfToDownloads" -> {
                              val bytes = call.argument<ByteArray>("bytes")
                              val fileName = call.argument<String>("fileName") ?: "FinTrax_Statement.pdf"
                              if (bytes == null) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              pendingPdfBytes = bytes
                              pendingPdfResult = result
                              val mimeType = if (fileName.endsWith(".txt", ignoreCase = true)) "text/plain" else "application/pdf"
                              val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = mimeType
                                  putExtra(Intent.EXTRA_TITLE, fileName)
                              }
                              startActivityForResult(intent, 1006)
                          }
                          "scheduleDailyReminder" -> {
                              val enabled = call.argument<Boolean>("enabled") ?: true
                              val hour = call.argument<Int>("hour") ?: 21
                              val minute = call.argument<Int>("minute") ?: 0
                              if (enabled) {
                                  ReminderReceiver.scheduleNext(this, hour, minute)
                              } else {
                                  ReminderReceiver.cancel(this)
                              }
                              result.success(true)
                          }
                          "openUrl" -> {
                              val url = call.argument<String>("url") ?: ""
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra("open_monthly_insights", false)) {
                      pendingInsightOpen = true
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                  if (requestCode == 1001) {
                      pendingSmsResult?.success(granted)
                      pendingSmsResult = null
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  when (requestCode) {
                      1002 -> {
                          pendingAuthResult?.success(resultCode == Activity.RESULT_OK)
                          pendingAuthResult = null
                      }
                      1006 -> {
                          if (resultCode == Activity.RESULT_OK && data?.data != null && pendingPdfBytes != null) {
                              try {
                                  contentResolver.openOutputStream(data.data!!)?.use { out ->
                                      out.write(pendingPdfBytes!!)
                                  }
                                  pendingPdfResult?.success(true)
                              } catch (e: Exception) {
                                  pendingPdfResult?.success(false)
                              }
                          } else {
                              pendingPdfResult?.success(false)
                          }
                          pendingPdfBytes = null
                          pendingPdfResult = null
                      }
                  }
              }
          }
          EOF
        
