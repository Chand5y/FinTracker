name: Build Fintrack APK
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04 
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android configuration files
        run: flutter create --project-name fintrack --org com.chandankumar .

      - name: Configure Native Bridge (Persistent Drive Sync, Notifications, Biometrics & PDF Saver)
        run: |
          INSTALLED_NDK=$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -n 1)
          echo "Using pre-installed NDK: $INSTALLED_NDK"
          sed -i "s/flutter.ndkVersion/\"$INSTALLED_NDK\"/g" android/app/build.gradle*
          sed -i 's/android:label="fintrack"/android:label="FinTrax"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_SMS"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <application android:allowBackup="true" android:fullBackupOnly="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <receiver android:name=".ReminderReceiver" android:exported="false"\/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/chandankumar/fintrack

          cat << 'EOF' > android/app/src/main/kotlin/com/chandankumar/fintrack/ReminderReceiver.kt
          package com.chandankumar.fintrack

          import android.Manifest
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import java.util.Calendar

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val channelId = "fintrax_daily_reminder"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Daily Expense Reminders", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(channel)
                  }

                  val todaySmsCount = countTodayBankSms(context)
                  val title = if (todaySmsCount > 0) {
                      "FinTrax • $todaySmsCount Bank Transaction${if (todaySmsCount > 1) "s" else ""} Found"
                  } else {
                      "FinTrax • Daily Expense Reminder"
                  }
                  val bodyText = if (todaySmsCount > 0) {
                      "We found $todaySmsCount bank/UPI transaction${if (todaySmsCount > 1) "s" else ""} today. Tap to log them into your book!"
                  } else {
                      "Made any expenses or income today? Tap to log today's entries in your book."
                  }

                  val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }
                  val contentPi = PendingIntent.getActivity(context, 2001, launchIntent, piFlags)

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      android.app.Notification.Builder(context, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      android.app.Notification.Builder(context)
                  }

                  builder.setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(bodyText)
                      .setAutoCancel(true)
                      .setContentIntent(contentPi)

                  nm.notify(3001, builder.build())

                  val hour = intent?.getIntExtra("hour", 22) ?: 22
                  val minute = intent?.getIntExtra("minute", 0) ?: 0
                  scheduleNext(context, hour, minute)
              }

              private fun countTodayBankSms(context: Context): Int {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      context.checkSelfPermission(Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) {
                      return 0
                  }
                  var count = 0
                  try {
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, 0)
                          set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                      }
                      val startOfDay = cal.timeInMillis
                      val cursor = context.contentResolver.query(
                          Uri.parse("content://sms/inbox"),
                          arrayOf("body", "date"),
                          "date >= ?",
                          arrayOf(startOfDay.toString()),
                          "date DESC"
                      )
                      val bankRegex = Regex("(a/c|acct|account|bank|upi|vpa|card|debited|credited|spent|paid)", RegexOption.IGNORE_CASE)
                      val txRegex = Regex("(debited|spent|paid|sent\\s+rs|withdrawn|credited|received)", RegexOption.IGNORE_CASE)
                      val amtRegex = Regex("(?:rs\\.?|inr|₹)\\s*[0-9,]+", RegexOption.IGNORE_CASE)
                      cursor?.use {
                          val bodyIdx = it.getColumnIndex("body")
                          while (it.moveToNext()) {
                              val body = if (bodyIdx >= 0) it.getString(bodyIdx) ?: "" else ""
                              val lower = body.lowercase()
                              if (!lower.contains("otp") && !lower.contains("verification code") &&
                                  bankRegex.containsMatchIn(body) && txRegex.containsMatchIn(body) && amtRegex.containsMatchIn(body)) {
                                  count++
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return count
              }

              companion object {
                  fun scheduleNext(context: Context, hour: Int, minute: Int) {
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, ReminderReceiver::class.java).apply {
                          putExtra("hour", hour)
                          putExtra("minute", minute)
                      }
                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pi = PendingIntent.getBroadcast(context, 4001, intent, flags)
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, hour)
                          set(Calendar.MINUTE, minute)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                          if (timeInMillis <= System.currentTimeMillis()) {
                              add(Calendar.DAY_OF_YEAR, 1)
                          }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      } else {
                          am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      }
                  }

                  fun cancel(context: Context) {
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, ReminderReceiver::class.java)
                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pi = PendingIntent.getBroadcast(context, 4001, intent, flags)
                      am.cancel(pi)
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/chandankumar/fintrack/MainActivity.kt
          package com.chandankumar.fintrack

          import android.Manifest
          import android.accounts.AccountManager
          import android.app.Activity
          import android.app.KeyguardManager
          import android.app.backup.BackupManager
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.chandankumar.fintrack/sms"
              private var pendingResult: MethodChannel.Result? = null
              private var pendingPdfBytes: ByteArray? = null

              private fun getBackupFileName(account: String): String {
                  return account.lowercase().replace(Regex("[^a-z0-9._-]"), "_") + "_fintrax_cloud.json"
              }

              // Writes to MediaStore.Downloads so the backup survives "Clear Data" without any file picker popup
              private fun writePersistentBackup(account: String, jsonContent: String): Boolean {
                  val fileName = getBackupFileName(account)
                  var success = false

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      try {
                          val resolver = contentResolver
                          val collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                          val projection = arrayOf(MediaStore.MediaColumns._ID)
                          val selection = "${MediaStore.MediaColumns.DISPLAY_NAME} = ?"
                          val selectionArgs = arrayOf(fileName)

                          resolver.query(collection, projection, selection, selectionArgs, null)?.use { cursor ->
                              while (cursor.moveToNext()) {
                                  val id = cursor.getLong(0)
                                  val existingUri = ContentUris.withAppendedId(collection, id)
                                  resolver.delete(existingUri, null, null)
                              }
                          }

                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                              put(MediaStore.MediaColumns.MIME_TYPE, "application/json")
                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/FinTrax_Drive_Sync")
                          }
                          val uri = resolver.insert(collection, values)
                          if (uri != null) {
                              resolver.openOutputStream(uri, "wt")?.use { out ->
                                  out.write(jsonContent.toByteArray(Charsets.UTF_8))
                              }
                              success = true
                          }
                      } catch (_: Exception) {}
                  }

                  try {
                      val pubDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "FinTrax_Drive_Sync")
                      if (!pubDir.exists()) pubDir.mkdirs()
                      File(pubDir, fileName).writeText(jsonContent, Charsets.UTF_8)
                      success = true
                  } catch (_: Exception) {}

                  try {
                      val internalDir = File(filesDir, "GoogleDriveBackup")
                      if (!internalDir.exists()) internalDir.mkdirs()
                      File(internalDir, fileName).writeText(jsonContent, Charsets.UTF_8)
                      success = true
                  } catch (_: Exception) {}

                  return success
              }

              private fun readPersistentBackup(account: String): String? {
                  val fileName = getBackupFileName(account)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      try {
                          val resolver = contentResolver
                          val collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                          val projection = arrayOf(MediaStore.MediaColumns._ID)
                          val selection = "${MediaStore.MediaColumns.DISPLAY_NAME} = ?"
                          val selectionArgs = arrayOf(fileName)

                          resolver.query(collection, projection, selection, selectionArgs, "${MediaStore.MediaColumns.DATE_MODIFIED} DESC")?.use { cursor ->
                              if (cursor.moveToFirst()) {
                                  val id = cursor.getLong(0)
                                  val uri = ContentUris.withAppendedId(collection, id)
                                  val text = resolver.openInputStream(uri)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }
                                  if (!text.isNullOrEmpty()) return text
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  try {
                      val pubFile = File(File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "FinTrax_Drive_Sync"), fileName)
                      if (pubFile.exists() && pubFile.length() > 0) {
                          return pubFile.readText(Charsets.UTF_8)
                      }
                  } catch (_: Exception) {}

                  try {
                      val internalFile = File(File(filesDir, "GoogleDriveBackup"), fileName)
                      if (internalFile.exists() && internalFile.length() > 0) {
                          return internalFile.readText(Charsets.UTF_8)
                      }
                  } catch (_: Exception) {}

                  return null
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "requestSmsPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  if (checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED) {
                                      result.success(true)
                                  } else {
                                      pendingResult = result
                                      requestPermissions(arrayOf(Manifest.permission.READ_SMS), 1001)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }
                          "checkSmsPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  result.success(checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED)
                              } else {
                                  result.success(true)
                              }
                          }
                          "getBankSms" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) {
                                  result.success(emptyList<Map<String, Any>>())
                                  return@setMethodCallHandler
                              }
                              val smsList = mutableListOf<Map<String, Any>>()
                              try {
                                  val cursor = contentResolver.query(
                                      Uri.parse("content://sms/inbox"),
                                      arrayOf("_id", "address", "body", "date"),
                                      null,
                                      null,
                                      "date DESC"
                                  )
                                  cursor?.use {
                                      val idIdx = it.getColumnIndex("_id")
                                      val addrIdx = it.getColumnIndex("address")
                                      val bodyIdx = it.getColumnIndex("body")
                                      val dateIdx = it.getColumnIndex("date")
                                      var count = 0
                                      while (it.moveToNext() && count < 120) {
                                          val id = if (idIdx >= 0) it.getString(idIdx) ?: "" else ""
                                          val addr = if (addrIdx >= 0) it.getString(addrIdx) ?: "" else ""
                                          val body = if (bodyIdx >= 0) it.getString(bodyIdx) ?: "" else ""
                                          val date = if (dateIdx >= 0) it.getLong(dateIdx) else 0L
                                          smsList.add(mapOf("id" to id, "address" to addr, "body" to body, "date" to date))
                                          count++
                                      }
                                  }
                                  result.success(smsList)
                              } catch (e: Exception) {
                                  result.success(emptyList<Map<String, Any>>())
                              }
                          }
                          "isDeviceSecure" -> {
                              val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              result.success(km.isKeyguardSecure)
                          }
                          "authenticateDevice" -> {
                              val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              if (km.isKeyguardSecure) {
                                  @Suppress("DEPRECATION")
                                  val intent = km.createConfirmDeviceCredentialIntent("Unlock FinTrax", "Use your fingerprint or phone screen lock")
                                  if (intent != null) {
                                      pendingResult = result
                                      startActivityForResult(intent, 1002)
                                  } else {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          "pickGoogleAccount" -> {
                              try {
                                  @Suppress("DEPRECATION")
                                  val intent = AccountManager.newChooseAccountIntent(
                                      null,
                                      null,
                                      arrayOf("com.google"),
                                      false,
                                      null,
                                      null,
                                      null,
                                      null
                                  )
                                  pendingResult = result
                                  startActivityForResult(intent, 1005)
                              } catch (e: Exception) {
                                  result.success(null)
                              }
                          }
                          "performDriveBackup" -> {
                              val account = call.argument<String>("account") ?: ""
                              val jsonContent = call.argument<String>("data") ?: ""
                              if (account.isEmpty() || jsonContent.isEmpty()) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              val ok = writePersistentBackup(account, jsonContent)
                              try { BackupManager(this).dataChanged() } catch (_: Exception) {}
                              result.success(ok)
                          }
                          "checkDriveBackup" -> {
                              val account = call.argument<String>("account") ?: ""
                              if (account.isEmpty()) {
                                  result.success(null)
                                  return@setMethodCallHandler
                              }
                              result.success(readPersistentBackup(account))
                          }
                          "savePdfToDownloads" -> {
                              val bytes = call.argument<ByteArray>("bytes")
                              val fileName = call.argument<String>("fileName") ?: "FinTrax_Statement.pdf"
                              if (bytes == null) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              pendingPdfBytes = bytes
                              pendingResult = result
                              val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "application/pdf"
                                  putExtra(Intent.EXTRA_TITLE, fileName)
                              }
                              startActivityForResult(intent, 1006)
                          }
                          "scheduleDailyReminder" -> {
                              val enabled = call.argument<Boolean>("enabled") ?: true
                              val hour = call.argument<Int>("hour") ?: 22
                              val minute = call.argument<Int>("minute") ?: 0
                              if (enabled) {
                                  if (Build.VERSION.SDK_INT >= 33 &&
                                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1007)
                                  }
                                  ReminderReceiver.scheduleNext(this, hour, minute)
                              } else {
                                  ReminderReceiver.cancel(this)
                              }
                              result.success(true)
                          }
                          "openUrl" -> {
                              val url = call.argument<String>("url") ?: ""
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1001) {
                      val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                      pendingResult?.success(granted)
                      pendingResult = null
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  when (requestCode) {
                      1002 -> {
                          pendingResult?.success(resultCode == Activity.RESULT_OK)
                          pendingResult = null
                      }
                      1005 -> {
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              val accountName = data.getStringExtra(AccountManager.KEY_ACCOUNT_NAME)
                              pendingResult?.success(accountName)
                          } else {
                              pendingResult?.success(null)
                          }
                          pendingResult = null
                      }
                      1006 -> {
                          if (resultCode == Activity.RESULT_OK && data?.data != null && pendingPdfBytes != null) {
                              try {
                                  contentResolver.openOutputStream(data.data!!)?.use { out ->
                                      out.write(pendingPdfBytes!!)
                                  }
                                  pendingResult?.success(true)
                              } catch (e: Exception) {
                                  pendingResult?.success(false)
                              }
                          } else {
                              pendingResult?.success(false)
                          }
                          pendingPdfBytes = null
                          pendingResult = null
                      }
                  }
              }
          }
          EOF
        
      - run: flutter pub get
      
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Build Lightweight Split APK
        run: flutter build apk --release --split-per-abi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
