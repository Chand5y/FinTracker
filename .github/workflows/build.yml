name: Build Fintracker APK
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      # Forces the lowercase project name and assigns your custom Android package ID
      - name: Generate Android configuration files
        run: flutter create --project-name fintracker --org com.chandankumar .
        
      - run: flutter pub get
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fintracker-release
          path: build/app/outputs/flutter-apk/app-release.apk
